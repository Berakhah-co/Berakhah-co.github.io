<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Berakhah - Redirigiendo...</title>
    <meta name="robots" content="noindex">
    <!-- 
      Hack para GitHub Pages Single Page Apps.
      Si un usuario entra directamente a berakmedellin.shop/producto/anillo,
      GitHub Pages lanza un 404 (porque no existe la carpeta producto/anillo).
      Esta página atrapa ese error y lo pasa al index como: /?p=/producto/anillo
      Luego, index.html procesa la rula, carga el iframe y restaura la URL visualmente a /producto/anillo
    -->
    <script type="text/javascript">
      // Se conserva todo el enlace: ruta, datos (?pedido=...&tel=...) y #ancla
      var path = window.location.pathname + window.location.search + window.location.hash;
      // El panel de administración y el enlace de anuncios /pedir-rappi se abren directo en el servidor de la
      // tienda (dentro del iframe no funcionan: el panel pierde la sesión y un iframe no puede abrir la app de Rappi)
      if (/^\/(admin|login|pedir-rappi)(\/|\?|#|$)/.test(window.location.pathname)) {
        window.location.replace('https://berakhahmedellin.pythonanywhere.com' + path);
      } else {
        // Se pasa el referido (Google, Instagram…): al redirigir, el navegador lo pierde
        var ref = document.referrer && document.referrer.indexOf(location.origin) !== 0 ? '&ref=' + encodeURIComponent(document.referrer) : '';
        window.location.replace('/?p=' + encodeURIComponent(path) + ref);
      }
    </script>
  </head>
  <body style="background: black; color: white;">
    Redirigiendo a tu producto...
  </body>
</html>
