<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Metadatos SEO -->

    <meta

      content="Berakhah, Valley of Blessing, joyería Medellín, accesorios con propósito, anillos, collares, pulseras, zarcillos, moda Medellín"
    />

    <meta
      property="og:description"
      content="Joyas con significado y diseño exclusivo. Explora nuestra colección completa."
    />
    <meta property="og:image" content="static/Logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://berakhahmedellin.shop/"
    />
    <meta property="twitter:title" content="Berakhah — Valley of Blessing" />
    <meta
      property="twitter:description"
      content="Joyas con significado y diseño exclusivo. Explora nuestra colección completa."
    />

    <!-- Icono -->
    <link rel="icon" href="static/iconos/Logo.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="static/Logo.jpg" />

    <!-- Google Fonts for Premium Branding -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Outfit:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #060606;
      }
      
      /* ========================================================
         LOADER DE ALTA JOYERÍA — BERAKHAH VALLEY OF BLESSING
         ======================================================== */
      .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #060606;
        background-image: 
          radial-gradient(circle at 50% 42%, rgba(212, 175, 55, 0.16) 0%, rgba(28, 23, 15, 0.85) 45%, #060606 85%),
          radial-gradient(circle at 50% 100%, rgba(180, 142, 40, 0.08) 0%, transparent 60%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                    filter 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                    visibility 0.8s;
        will-change: opacity, transform, filter;
      }

      .loader-wrapper.fade-out {
        opacity: 0;
        transform: scale(1.04);
        filter: blur(10px);
        visibility: hidden;
        pointer-events: none;
      }

      .loader-content {
        position: relative;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.6rem;
        padding: 20px;
        max-width: 90vw;
      }

      /* Ambient Glow Orb */
      .loader-aura {
        position: absolute;
        top: 35%;
        left: 50%;
        width: 280px;
        height: 280px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(212, 175, 55, 0.22) 0%, rgba(212, 175, 55, 0) 70%);
        filter: blur(25px);
        pointer-events: none;
        animation: auraPulse 4s ease-in-out infinite alternate;
      }

      /* Emblema Joya / Diamante Facetado con Anillos Orbitales */
      .jewelry-emblem-container {
        position: relative;
        width: 110px;
        height: 110px;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 800px;
      }

      /* Halo Orbital 3D Exterior */
      .halo-ring {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-top-color: rgba(255, 235, 170, 0.95);
        border-right-color: rgba(212, 175, 55, 0.6);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        transform-style: preserve-3d;
        animation: spinHalo 5s linear infinite;
      }

      .halo-ring-inner {
        position: absolute;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        border: 1px dashed rgba(212, 175, 55, 0.4);
        border-bottom-color: rgba(255, 230, 160, 0.9);
        animation: spinHaloReverse 7s linear infinite;
      }

      /* Diamante Vectorial SVG */
      .diamond-svg-wrap {
        position: relative;
        width: 58px;
        height: 58px;
        z-index: 2;
        filter: drop-shadow(0 0 16px rgba(212, 175, 55, 0.55));
        animation: floatDiamond 3.6s ease-in-out infinite;
      }

      .diamond-svg-wrap svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      /* Destellos Estelares de 4 Puntas */
      .gem-sparkle {
        position: absolute;
        pointer-events: none;
        z-index: 3;
      }

      .gem-sparkle svg {
        fill: #fffdf5;
        filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 16px #d4af37);
      }

      .gem-sparkle-1 {
        top: 2px;
        right: 18px;
        width: 18px;
        height: 18px;
        animation: sparkleStar 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .gem-sparkle-2 {
        bottom: 8px;
        left: 14px;
        width: 14px;
        height: 14px;
        animation: sparkleStar 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.4s;
      }

      /* Micro Polvo de Oro Flotante */
      .dust-particle {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #f7e1a0;
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(247, 225, 160, 0.9);
        pointer-events: none;
        opacity: 0;
      }

      .p1 { top: -15px; left: 15px; animation: floatDust 4s ease-in-out infinite; }
      .p2 { top: 20px; right: -20px; animation: floatDust 4.5s ease-in-out infinite 1s; }
      .p3 { bottom: -10px; right: 20px; animation: floatDust 3.8s ease-in-out infinite 2s; }
      .p4 { bottom: 25px; left: -15px; animation: floatDust 5s ease-in-out infinite 1.5s; }

      /* Tipografía con Shimmer Metálico Líquido */
      .brand-typography {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
      }

      .loader-title {
        font-family: 'Cinzel', 'Playfair Display', serif;
        font-size: 2.2rem;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        margin-right: -0.34em; /* Compensar letter-spacing para centrado perfecto */
        background: linear-gradient(
          120deg, 
          #bf953f 0%, 
          #fcf6ba 25%, 
          #b38728 50%, 
          #fbf5b7 75%, 
          #aa771c 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmerGold 3.8s linear infinite;
        text-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
      }

      /* Divisor Ornamental con Filigrana */
      .brand-divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 190px;
        margin: 2px 0;
        opacity: 0.85;
      }

      .brand-divider .line {
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(212, 175, 55, 0.7), transparent);
      }

      .brand-divider .gem-dot {
        width: 6px;
        height: 6px;
        background: #fdf5d6;
        border: 1px solid #d4af37;
        transform: rotate(45deg);
        box-shadow: 0 0 8px rgba(212, 175, 55, 0.7);
      }

      .loader-subtext {
        font-family: 'Outfit', sans-serif;
        color: #c7b99c;
        font-size: 0.75rem;
        font-weight: 300;
        letter-spacing: 0.45em;
        text-transform: uppercase;
        margin-right: -0.45em;
        opacity: 0.9;
      }

      /* Barra de Carga Ultra-Fina de Lujo */
      .loader-progress-track {
        width: 140px;
        height: 1.5px;
        background: rgba(212, 175, 55, 0.15);
        border-radius: 4px;
        position: relative;
        overflow: hidden;
        margin-top: 0.4rem;
      }

      .loader-progress-bar {
        position: absolute;
        top: 0;
        left: -100%;
        width: 60%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #ffe7a3, #d4af37, transparent);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.8);
        border-radius: 4px;
        animation: progressFlow 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* Keyframe Animations */
      @keyframes spinHalo {
        0% { transform: rotateX(68deg) rotateZ(0deg); }
        100% { transform: rotateX(68deg) rotateZ(360deg); }
      }

      @keyframes spinHaloReverse {
        0% { transform: rotateX(68deg) rotateZ(360deg); }
        100% { transform: rotateX(68deg) rotateZ(0deg); }
      }

      @keyframes floatDiamond {
        0%, 100% {
          transform: translateY(0px) scale(1);
        }
        50% {
          transform: translateY(-6px) scale(1.03);
        }
      }

      @keyframes shimmerGold {
        0% { background-position: 0% center; }
        100% { background-position: 200% center; }
      }

      @keyframes sparkleStar {
        0%, 100% {
          opacity: 0;
          transform: scale(0.3) rotate(0deg);
        }
        40%, 60% {
          opacity: 1;
          transform: scale(1.1) rotate(90deg);
        }
        80% {
          opacity: 0;
          transform: scale(0.4) rotate(180deg);
        }
      }

      @keyframes floatDust {
        0% { opacity: 0; transform: translateY(8px) scale(0.7); }
        50% { opacity: 0.9; transform: translateY(-8px) scale(1.2); }
        100% { opacity: 0; transform: translateY(-20px) scale(0.5); }
      }

      @keyframes auraPulse {
        0% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); }
        100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.15); }
      }

      @keyframes progressFlow {
        0% { left: -60%; }
        100% { left: 120%; }
      }

      /* Mobile Optimizations */
      @media (max-width: 480px) {
        .loader-title {
          font-size: 1.85rem;
          letter-spacing: 0.28em;
          margin-right: -0.28em;
        }
        .loader-subtext {
          font-size: 0.68rem;
          letter-spacing: 0.35em;
          margin-right: -0.35em;
        }
        .jewelry-emblem-container {
          width: 95px;
          height: 95px;
        }
        .halo-ring {
          width: 82px;
          height: 82px;
        }
      }

      /* El contenedor que manejará el scroll si el iframe crece en iOS */
      /* Contenedor fluido envolvente nativo para iOS */
      .iframe-container {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        -webkit-overflow-scrolling: touch;
        overflow-y: scroll; /* Delega el scroll fluido al wrapper exterior */
        overflow-x: hidden;
      }
      iframe {
        width: 1px;
        min-width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Loader Premium Haute Joaillerie Berakhah -->
    <div id="loader" class="loader-wrapper" aria-label="Cargando Berakhah Joyería">
      <div class="loader-aura"></div>
      
      <div class="loader-content">
        <!-- Emblema Central: Diamante & Halos de Luz 3D -->
        <div class="jewelry-emblem-container">
          <div class="halo-ring"></div>
          <div class="halo-ring-inner"></div>

          <!-- Micro-partículas de polvo de oro -->
          <div class="dust-particle p1"></div>
          <div class="dust-particle p2"></div>
          <div class="dust-particle p3"></div>
          <div class="dust-particle p4"></div>

          <!-- Destellos Estelares -->
          <div class="gem-sparkle gem-sparkle-1">
            <svg viewBox="0 0 24 24">
              <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z"/>
            </svg>
          </div>
          <div class="gem-sparkle gem-sparkle-2">
            <svg viewBox="0 0 24 24">
              <path d="M12 0L14.4 9.6L24 12L14.4 14.4L12 24L9.6 14.4L0 12L9.6 9.6L12 0Z"/>
            </svg>
          </div>

          <!-- Diamante Vectorial de Precisión Tallada -->
          <div class="diamond-svg-wrap">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="goldGradientMain" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fff8d6"/>
                  <stop offset="35%" stop-color="#d4af37"/>
                  <stop offset="70%" stop-color="#aa771c"/>
                  <stop offset="100%" stop-color="#fdf3a9"/>
                </linearGradient>
                <linearGradient id="goldFacetGleam" x1="50%" y1="0%" x2="50%" y2="100%">
                  <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
                  <stop offset="50%" stop-color="rgba(212,175,55,0.2)"/>
                  <stop offset="100%" stop-color="rgba(170,119,28,0.05)"/>
                </linearGradient>
              </defs>
              
              <!-- Facetas Superiores e Inferiores de la Corona -->
              <polygon points="50,6 78,32 22,32" stroke="url(#goldGradientMain)" stroke-width="1.8" fill="url(#goldFacetGleam)"/>
              <polygon points="50,6 22,32 6,32 28,6" stroke="url(#goldGradientMain)" stroke-width="1.8" fill="rgba(212,175,55,0.12)"/>
              <polygon points="50,6 78,32 94,32 72,6" stroke="url(#goldGradientMain)" stroke-width="1.8" fill="rgba(212,175,55,0.12)"/>
              
              <!-- Pabellón y Cúspide Inferior -->
              <polygon points="22,32 78,32 50,94" stroke="url(#goldGradientMain)" stroke-width="2" fill="url(#goldFacetGleam)"/>
              <polygon points="6,32 22,32 50,94" stroke="url(#goldGradientMain)" stroke-width="1.8" fill="rgba(170,119,28,0.18)"/>
              <polygon points="94,32 78,32 50,94" stroke="url(#goldGradientMain)" stroke-width="1.8" fill="rgba(170,119,28,0.18)"/>
              
              <!-- Reflejo Prisma Interior -->
              <line x1="50" y1="32" x2="50" y2="94" stroke="url(#goldGradientMain)" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.8"/>
            </svg>
          </div>
        </div>

        <!-- Branding Tipográfico -->
        <div class="brand-typography">
          <div class="loader-title">Berakhah</div>
          <div class="brand-divider">
            <span class="line"></span>
            <span class="gem-dot"></span>
            <span class="line"></span>
          </div>
          <div class="loader-subtext">Valley of Blessing</div>
        </div>

        <!-- Línea de Carga Minimalista -->
        <div class="loader-progress-track">
          <div class="loader-progress-bar"></div>
        </div>
      </div>
    </div>

    <div class="iframe-container">
      <iframe
        id="berakhah-iframe"
        src="https://berakhahmedellin.pythonanywhere.com/"
        title="Berakhah Medellín Store"
        allow="fullscreen; geolocation; microphone; camera; midi; encrypted-media"
        loading="eager"
      >
      </iframe>
    </div>

    <script>
      const BACKEND_URL = 'https://berakhahmedellin.pythonanywhere.com';
      const iframe = document.getElementById('berakhah-iframe');

      // Ocultar loader cuando el iframe termine de cargar
      const hideLoader = () => {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.classList.add('fade-out');
        }
      };

      iframe.addEventListener('load', hideLoader);

      // Ocultar loader por seguridad después de 12 segundos si hay fallos o lentitud extrema
      setTimeout(hideLoader, 12000);

      // 1. Initial Load: Check for 'p' param, hash, or direct pathname (e.g. /admin)
      const params = new URLSearchParams(window.location.search);
      const queryPath = params.get('p') || window.location.hash.replace('#', '');
      const currentPath = window.location.pathname;
      const initialPath = queryPath || (currentPath !== '/' && currentPath !== '/index.html' ? currentPath + window.location.search : '');

      if (initialPath && initialPath.startsWith('/')) {
        iframe.src = BACKEND_URL + initialPath;
        if (queryPath) {
          // Limpiamos la URL visible para que no se vea el ?p=
          window.history.replaceState(null, '', initialPath);
        }
      }

      // 2. Escuchar mensajes del iframe (navegación, WhatsApp y Rappi)
      // event.origin nunca trae barra final: se compara contra el origen normalizado
      const BACKEND_ORIGIN = new URL(BACKEND_URL).origin;
      window.addEventListener('message', (event) => {
        if (event.origin !== BACKEND_ORIGIN) return;

        if (event.data && event.data.type === 'NAV') {
          const newPath = event.data.path;
          
          // Si la ruta cambió y no somos la misma página
          if (window.location.pathname !== newPath) {
            // Actualizamos la URL a la versión "limpia" (ej: /producto/anillo)
            window.history.replaceState({ path: newPath }, '', newPath);
          }
        } else if (event.data && event.data.type === 'WHATSAPP_REDIRECT') {
          const url = String(event.data.url || '');
          if (/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(url)) {
            window.location.href = url;
          }
        } else if (event.data && event.data.type === 'RAPPI_OPEN') {
          // Chrome Android no deja que el iframe (otro dominio) abra la app de Rappi:
          // la navegación se hace desde esta página, que hereda el toque del usuario.
          const url = String(event.data.url || '');
          if (/^(intent:\/\/com\.grability\.rappi|gbrappi:\/\/|https:\/\/www\.rappi\.com\.co\/)/.test(url)) {
            event.source.postMessage({ type: 'RAPPI_OPEN_ACK' }, event.origin);
            window.location.href = url;
          }
        }
      });
    </script>
  </body>
</html>
