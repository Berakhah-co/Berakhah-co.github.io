    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        /* Forzamos 100% para evitar que el viewport de iOS nos juegue bromas */
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #080808;
      }

      /* Loader Estilo Premium Berakhah con Joya/Diamante */
      .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0c0b0a;
        background-image: radial-gradient(circle at center, #1c1a17 0%, #0c0b0a 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
      }
      .loader-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.8rem;
      }

      /* Icono de Diamante Premium Animado */
      .elegant-diamond-container {
        position: relative;
        width: 70px;
        height: 70px;
        margin-bottom: 5px;
      }
      .elegant-diamond {
        width: 44px;
        height: 44px;
        background: transparent;
        border: 2px solid #d4af37;
        position: absolute;
        top: 13px;
        left: 13px;
        transform: rotate(45deg);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        animation: diamondPulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .elegant-diamond::after {
        content: '';
        position: absolute;
        top: 4px;
        left: 4px;
        right: 4px;
        bottom: 4px;
        border: 1px solid rgba(212, 175, 55, 0.5);
      }
      /* Destellos de luz sobre el diamante */
      .sparkle {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 10px #fff, 0 0 20px #d4af37;
        opacity: 0;
        animation: sparkleAnim 3s ease-in-out infinite;
      }
      .sparkle-1 {
        width: 4px;
        height: 4px;
        top: 10px;
        left: 35px;
        animation-delay: 0.2s;
      }
      .sparkle-2 {
        width: 6px;
        height: 6px;
        top: 35px;
        right: 10px;
        animation-delay: 0.8s;
      }
      .sparkle-3 {
        width: 3px;
        height: 3px;
        bottom: 12px;
        left: 20px;
        animation-delay: 1.4s;
      }

      .loader-text {
        font-family: 'Playfair Display', 'Didot', 'Georgia', serif;
        color: #d4af37;
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 10px;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        animation: textPulse 2s ease-in-out infinite;
        margin-right: -10px;
      }
      .loader-subtext {
        font-family: 'Outfit', sans-serif;
        color: #a89f8d;
        font-size: 0.8rem;
        font-weight: 300;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-top: -0.8rem;
        margin-right: -6px;
      }

      @keyframes diamondPulse {
        0%, 100% {
          transform: rotate(45deg) scale(0.9);
          box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
          border-color: #b39b6d;
        }
        50% {
          transform: rotate(225deg) scale(1.05);
          box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
          border-color: #f1d37a;
        }
      }
      @keyframes sparkleAnim {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes textPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .loader-wrapper.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* El contenedor que manejará el scroll si el iframe crece en iOS */
      /* Contenedor fluido envolvente nativo para iOS */
      .iframe-container {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        -webkit-overflow-scrolling: touch;
        overflow-y: scroll; /* Delega el scroll fluido al wrapper exterior */
        overflow-x: hidden;
      }
      /* Aviso discreto cuando la tienda se carga desde un origen distinto al principal */
      .origen-aviso {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 10000;
        max-width: calc(100vw - 32px);
        padding: 8px 14px;
        border-radius: 20px;
        background: rgba(20, 18, 15, 0.88);
        color: #f1d37a;
        font: 500 12px 'Outfit', sans-serif;
        text-align: center;
        pointer-events: none;
      }
      .origen-aviso[hidden] {
        display: none;
      }
      iframe {
        width: 1px;
        min-width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>

  <body>
    <!-- Loader Premium Berakhah con Diamante -->
    <div id="loader" class="loader-wrapper">
      <div class="loader-content">
        <div class="elegant-diamond-container">
          <div class="elegant-diamond"></div>
          <div class="sparkle sparkle-1"></div>
          <div class="sparkle sparkle-2"></div>
          <div class="sparkle sparkle-3"></div>
        </div>
        <div class="loader-text">Berakhah</div>
        <div class="loader-subtext">Valley of Blessing</div>
      </div>
    </div>

    <noscript>
      <h1>Berakhah — Joyería con Propósito en Medellín</h1>
      <p>Collares, anillos ajustables, aretes, candongas y pulseras con significado. Empaque de regalo incluido y entrega rápida en Medellín y el Valle de Aburrá, también por Rappi.</p>
      <p><a href="https://berakhahmedellin.pythonanywhere.com/">Ver la colección completa</a> · <a href="https://www.rappi.com.co/tiendas/900419085-berakhah-mt-enc">Pedir en Rappi</a> · <a href="https://wa.me/573017517177">WhatsApp</a></p>
    </noscript>

    <div class="iframe-container">
      <iframe
        id="berakhah-iframe"
        title="Berakhah Medellín Store"
        allow="fullscreen; geolocation; microphone; camera; midi; encrypted-media"
        loading="eager"
      >
      </iframe>
    </div>

    <div id="origen-aviso" class="origen-aviso" hidden></div>

    <script>
      // ── Origen de la tienda ──────────────────────────────────────────────
      // PRINCIPAL: la tienda que ven todos los clientes. Para mudarse a Render basta cambiar 'pa' por 'render'.
      // Si la principal no responde a tiempo, se carga sola la otra (respaldo).
      // Para probar en tu navegador sin afectar a nadie:  ?origen=render  ·  ?origen=pa  ·  ?origen=auto (volver a lo normal)
      const SERVIDORES = {
        pa: { nombre: 'PythonAnywhere', url: 'https://berakhahmedellin.pythonanywhere.com', espera: 12000 },
        render: { nombre: 'Render', url: 'https://berakahhshop.onrender.com', espera: 70000 } // Render gratis tarda ~1 min si estaba dormido
      };
      const PRINCIPAL = 'pa';

      const params = new URLSearchParams(window.location.search);
      const leer = () => { try { return localStorage.getItem('berakhah_origen'); } catch (e) { return null; } };
      const guardar = (v) => { try { v ? localStorage.setItem('berakhah_origen', v) : localStorage.removeItem('berakhah_origen'); } catch (e) {} };

      const pedido = (params.get('origen') || '').toLowerCase();
      if (pedido === 'auto') guardar(null);
      else if (SERVIDORES[pedido]) guardar(pedido);
      const forzado = SERVIDORES[leer()] ? leer() : null; // elegido a mano en este navegador
      let actual = forzado || PRINCIPAL;
      let origenActual = new URL(SERVIDORES[actual].url).origin; // event.origin nunca trae barra final
      let respondio = false;
      let temporizador = null;

      const iframe = document.getElementById('berakhah-iframe');
      const loader = document.getElementById('loader');
      const hideLoader = () => loader && loader.classList.add('fade-out');

      // Ruta a abrir: ?p=/producto/x (enlaces compartidos) o #/ruta
      const initialPath = params.get('p') || window.location.hash.replace('#', '');
      let rutaActual = initialPath && initialPath.startsWith('/') ? initialPath : '/';
      // URL visible limpia (sin ?p= ni ?origen=)
      if (params.has('p') || params.has('origen')) window.history.replaceState(null, '', rutaActual);

      function mostrarAviso() {
        const aviso = document.getElementById('origen-aviso');
        if (!forzado && actual === PRINCIPAL) { aviso.hidden = true; return; }
        aviso.textContent = forzado
          ? `Tienda desde ${SERVIDORES[actual].nombre} (solo en este navegador · ?origen=auto para volver)`
          : `Tienda de respaldo: ${SERVIDORES[actual].nombre}`;
        aviso.hidden = false;
        setTimeout(() => { aviso.hidden = true; }, 8000);
      }

      function cargar(clave) {
        actual = clave;
        origenActual = new URL(SERVIDORES[clave].url).origin;
        respondio = false;
        iframe.src = origenActual + rutaActual;
        mostrarAviso();
        clearTimeout(temporizador);
        // Respaldo automático: si la tienda no avisa que cargó, se intenta con la otra (solo sin origen forzado)
        temporizador = setTimeout(() => {
          if (respondio) return;
          const otra = clave === 'pa' ? 'render' : 'pa';
          if (!forzado && clave === PRINCIPAL) {
            console.warn(`[Berakhah] ${SERVIDORES[clave].nombre} no respondió; cargando ${SERVIDORES[otra].nombre}.`);
            cargar(otra);
          } else {
            hideLoader(); // sin más opciones: se muestra lo que haya
          }
        }, SERVIDORES[clave].espera);
      }

      cargar(actual);

      // Escuchar mensajes del iframe (navegación, WhatsApp y Rappi)
      window.addEventListener('message', (event) => {
        if (event.origin !== origenActual) return;

        if (event.data && event.data.type === 'NAV') {
          // La tienda cargó de verdad (no una página de error del hosting)
          respondio = true;
          clearTimeout(temporizador);
          hideLoader();
          const newPath = String(event.data.path || '/');
          rutaActual = newPath;
          if (window.location.pathname !== newPath) {
            // Actualizamos la URL a la versión "limpia" (ej: /producto/anillo)
            window.history.replaceState({ path: newPath }, '', newPath);
          }
        } else if (event.data && event.data.type === 'WHATSAPP_REDIRECT') {
          const url = String(event.data.url || '');
          if (/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(url)) {
            window.location.href = url;
          }
        } else if (event.data && event.data.type === 'RAPPI_OPEN') {
          // Chrome Android no deja que el iframe (otro dominio) abra la app de Rappi:
          // la navegación se hace desde esta página, que hereda el toque del usuario.
          const url = String(event.data.url || '');
          if (/^(intent:\/\/com\.grability\.rappi|gbrappi:\/\/|https:\/\/www\.rappi\.com\.co\/)/.test(url)) {
            event.source.postMessage({ type: 'RAPPI_OPEN_ACK' }, event.origin);
            window.location.href = url;
          }
        }
      });
    </script>
