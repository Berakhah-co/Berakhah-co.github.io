<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Metadatos SEO -->
    <title>Berakhah — Valley of Blessing</title>
    <meta
      name="description"
      content="Descubre la colección Berakhah de joyería refinada y accesorios con propósito. Piezas únicas que cuentan tu historia. Joyería exclusiva en Medellín."
    />
    <meta
      name="keywords"
      content="Berakhah, Valley of Blessing, joyería Medellín, accesorios con propósito, anillos, collares, pulseras, zarcillos, moda Medellín"
    />
    <meta name="author" content="Berakhah Medellín" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://berakahhshop.onrender.com/"
    />
    <meta property="og:title" content="Berakhah — Valley of Blessing" />
    <meta
      property="og:description"
      content="Joyas con significado y diseño exclusivo. Explora nuestra colección completa."
    />
    <meta property="og:image" content="static/Logo.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://berakahhshop.onrender.com/"
    />
    <meta property="twitter:title" content="Berakhah — Valley of Blessing" />
    <meta
      property="twitter:description"
      content="Joyas con significado y diseño exclusivo. Explora nuestra colección completa."
    />

    <!-- Icono -->
    <link rel="icon" href="static/iconos/Logo.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="static/Logo.jpg" />

    <!-- Google Fonts for Premium Branding -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        /* Forzamos 100% para evitar que el viewport de iOS nos juegue bromas */
        height: 100%;
        width: 100%;
        overflow: hidden;
        background-color: #080808;
      }
      
      /* Loader Estilo Premium Berakhah con Joya/Diamante */
      .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0c0b0a;
        background-image: radial-gradient(circle at center, #1c1a17 0%, #0c0b0a 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.5s;
      }
      .loader-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.8rem;
      }
      
      /* Icono de Diamante Premium Animado */
      .elegant-diamond-container {
        position: relative;
        width: 70px;
        height: 70px;
        margin-bottom: 5px;
      }
      .elegant-diamond {
        width: 44px;
        height: 44px;
        background: transparent;
        border: 2px solid #d4af37;
        position: absolute;
        top: 13px;
        left: 13px;
        transform: rotate(45deg);
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        animation: diamondPulse 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .elegant-diamond::after {
        content: '';
        position: absolute;
        top: 4px;
        left: 4px;
        right: 4px;
        bottom: 4px;
        border: 1px solid rgba(212, 175, 55, 0.5);
      }
      /* Destellos de luz sobre el diamante */
      .sparkle {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 10px #fff, 0 0 20px #d4af37;
        opacity: 0;
        animation: sparkleAnim 3s ease-in-out infinite;
      }
      .sparkle-1 {
        width: 4px;
        height: 4px;
        top: 10px;
        left: 35px;
        animation-delay: 0.2s;
      }
      .sparkle-2 {
        width: 6px;
        height: 6px;
        top: 35px;
        right: 10px;
        animation-delay: 0.8s;
      }
      .sparkle-3 {
        width: 3px;
        height: 3px;
        bottom: 12px;
        left: 20px;
        animation-delay: 1.4s;
      }

      .loader-text {
        font-family: 'Playfair Display', 'Didot', 'Georgia', serif;
        color: #d4af37;
        font-size: 2rem;
        font-weight: 300;
        letter-spacing: 10px;
        text-transform: uppercase;
        text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        animation: textPulse 2s ease-in-out infinite;
        margin-right: -10px;
      }
      .loader-subtext {
        font-family: 'Outfit', sans-serif;
        color: #a89f8d;
        font-size: 0.8rem;
        font-weight: 300;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-top: -0.8rem;
        margin-right: -6px;
      }

      @keyframes diamondPulse {
        0%, 100% {
          transform: rotate(45deg) scale(0.9);
          box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
          border-color: #b39b6d;
        }
        50% {
          transform: rotate(225deg) scale(1.05);
          box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
          border-color: #f1d37a;
        }
      }
      @keyframes sparkleAnim {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes textPulse {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }

      .loader-wrapper.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* El contenedor que manejará el scroll si el iframe crece en iOS */
      /* Contenedor fluido envolvente nativo para iOS */
      .iframe-container {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        -webkit-overflow-scrolling: touch;
        overflow-y: scroll; /* Delega el scroll fluido al wrapper exterior */
        overflow-x: hidden;
      }
      iframe {
        width: 1px;
        min-width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- Loader Premium Berakhah con Diamante -->
    <div id="loader" class="loader-wrapper">
      <div class="loader-content">
        <div class="elegant-diamond-container">
          <div class="elegant-diamond"></div>
          <div class="sparkle sparkle-1"></div>
          <div class="sparkle sparkle-2"></div>
          <div class="sparkle sparkle-3"></div>
        </div>
        <div class="loader-text">Berakhah</div>
        <div class="loader-subtext">Valley of Blessing</div>
      </div>
    </div>

    <div class="iframe-container">
      <iframe
        id="berakhah-iframe"
        src="https://berakahhshop.onrender.com/"
        title="Berakhah Medellín Store"
        allow="fullscreen; geolocation; microphone; camera; midi; encrypted-media"
        loading="eager"
      >
      </iframe>
    </div>

    <script>
      const BACKEND_URL = 'https://berakahhshop.onrender.com/';
      const iframe = document.getElementById('berakhah-iframe');

      // Ocultar loader cuando el iframe termine de cargar
      const hideLoader = () => {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.classList.add('fade-out');
        }
      };

      iframe.addEventListener('load', hideLoader);

      // Ocultar loader por seguridad después de 12 segundos si hay fallos o lentitud extrema
      setTimeout(hideLoader, 12000);

      // 1. Initial Load: Check for 'p' param to load a deep link
      const params = new URLSearchParams(window.location.search);
      const initialPath = params.get('p') || window.location.hash.replace('#', '');
      
      if (initialPath && initialPath.startsWith('/')) {
        iframe.src = BACKEND_URL + initialPath;
        // Limpiamos la URL visible para que no se vea el ?p=
        window.history.replaceState(null, '', initialPath);
      }

      // 2. Escuchar cambios de navegación desde el iframe
      window.addEventListener('message', (event) => {
        if (event.origin !== BACKEND_URL) return;
        
        if (event.data && event.data.type === 'NAV') {
          const newPath = event.data.path;
          
          // Si la ruta cambió y no somos la misma página
          if (window.location.pathname !== newPath) {
            // Actualizamos la URL a la versión "limpia" (ej: /producto/anillo)
            window.history.replaceState({ path: newPath }, '', newPath);
          }
        } else if (event.data && event.data.type === 'WHATSAPP_REDIRECT') {
            window.location.href = event.data.url;
        }
      });
    </script>
  </body>
</html>
