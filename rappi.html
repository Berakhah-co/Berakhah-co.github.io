    <!-- Enlace de anuncios, Instagram y estados de WhatsApp (berakhahmedellin.shop/rappi). Pasa al servidor, que cuenta el

    <script>
        (function () {
            var destino = 'https://berakhahmedellin.pythonanywhere.com/pedir-rappi' + (location.search || '?c=corto');

            var android = /Android/i.test(ua);
            var navegadorDeApp = /; wv\)|Instagram|FBAN|FBAV|FB_IAB|musical_ly|TikTok|BytedanceWebview/i.test(ua);
            if (!(android && !navegadorDeApp)) { location.replace(destino); return; }
            document.addEventListener('DOMContentLoaded', function () {
                document.getElementById('abrir').href = destino;
                document.getElementById('caja').className = 'caja listo';
            });
        })();
    </script>
